<?xml version="1.0" encoding="UTF-8"?>
<!-- RingoMusic app icon: a red seal that wears headphones. One color. 128x128 GNOME grid. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="#e01b24">
  <!-- Seal: outer border, a thin empty ring, and the inner disc -->
  <circle cx="64" cy="72" r="29" stroke="#e01b24" stroke-width="4" fill="none"/>
  <circle cx="64" cy="72" r="24.5"/>

  <!-- Headband -->
  <path d="M17 72 C17 4 111 4 111 72" stroke="#e01b24" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Ear cups -->
  <rect x="7" y="58" width="20" height="36" rx="10"/>
  <rect x="101" y="58" width="20" height="36" rx="10"/>
</svg>
