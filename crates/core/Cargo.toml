[package]
name = "ringo-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Adds `MockEngine`, a scripted engine for tests.
mock = []

[dependencies]
ringo-am-api = { path = "../am-api" }
ringo-engine = { path = "../engine" }
async-trait.workspace = true
gio = "0.22"
rand = { workspace = true, features = ["std", "std_rng", "thread_rng"] }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# Enables the `mock` feature for the integration tests.
ringo-core = { path = ".", features = ["mock"] }
tokio = { workspace = true, features = ["test-util"] }
