#
# Flatpak manifest. Build the bundle with packaging/build-flatpak.sh.
#
# The runtime is GNOME 51, which is built on freedesktop 26.08. The base app and
# the SDK extensions use the same freedesktop branch.
app-id: io.github.MedaiP90.RingoMusic
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node24
command: ringomusic

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --own-name=org.mpris.MediaPlayer2.RingoMusic

build-options:
  # Cargo and npm download their packages during the build.
  build-args:
    - --share=network
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node24/bin
  env:
    CARGO_HOME: /run/build/ringomusic/cargo

modules:
  - name: ringomusic
    buildsystem: simple
    build-commands:
      # Keep this checksum and URL in sync with packaging/castlabs.sha256 and
      # engine/CASTLABS_VERSION.md (packaging/update-castlabs-sha.sh).
      - RINGO_CASTLABS_ZIP="$PWD/castlabs-electron.zip" packaging/stage.sh /app
      # Flatpak does not keep the SUID bit. zypak replaces chrome-sandbox.
      - chmod 0755 stage/app/lib/ringomusic/engine/chrome-sandbox
      - cp -a stage/app/. /app/
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - target
          - stage
          - dist
          - builddir
          - flatpak_app
          - repo
          - .flatpak-builder
          - engine/node_modules
          - engine/dist
      - type: file
        url: https://github.com/castlabs/electron-releases/releases/download/v45.2.1%2Bwvcus/electron-v45.2.1%2Bwvcus-linux-x64.zip
        sha256: 18953cdab1cdc2499f9b0089f85d069559bf992145008a40aacd0d7714b97960
        dest-filename: castlabs-electron.zip
