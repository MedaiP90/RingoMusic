#
# nfpm configuration for the .deb and the .rpm. Run it with packaging/build-packages.sh.
# Environment: VERSION (for example 0.9.0 or 0.9.0-rc.1), MAINTAINER.
name: ringomusic
arch: amd64
platform: linux
version: ${VERSION}
version_schema: semver
release: "1"
section: sound
priority: optional
maintainer: ${MAINTAINER}
homepage: https://ringomusic.netlify.app/
license: GPL-3.0-or-later
description: |
  Apple Music client for GNOME
  RingoMusic is a native GTK 4 application that plays Apple Music.
  A hidden engine does the playback and the Apple Music API requests.

contents:
  # The tree keeps the file modes of stage/. stage.sh sets the SUID mode 4755 on chrome-sandbox.
  - src: stage/usr
    dst: /usr
    type: tree
    file_info:
      owner: root
      group: root
  # The profile lets the engine create user namespaces on Ubuntu 24.04 and later.
  - src: packaging/apparmor/ringomusic
    dst: /etc/apparmor.d/ringomusic
    type: config
    packager: deb
    file_info:
      mode: 0644

  # The copyright file and the lintian overrides are deb only.
  - src: packaging/copyright
    dst: /usr/share/doc/ringomusic/copyright
    packager: deb
    file_info:
      mode: 0644
  - src: packaging/lintian-overrides
    dst: /usr/share/lintian/overrides/ringomusic
    packager: deb
    file_info:
      mode: 0644

scripts:
  postinstall: packaging/scripts/postinst.sh
  postremove: packaging/scripts/postrm.sh

overrides:
  deb:
    depends:
      - libc6 (>= 2.41)
      - libgtk-4-1 (>= 4.18)
      - libadwaita-1-0 (>= 1.7)
      - libgtk-3-0t64 | libgtk-3-0
      - libnss3
      - libasound2t64 | libasound2
      - libgbm1
      - libdbus-1-3
      - libcups2t64 | libcups2
      - libxkbcommon0
      - libatspi2.0-0t64 | libatspi2.0-0
      - libatk-bridge2.0-0t64 | libatk-bridge2.0-0
  rpm:
    depends:
      - gtk4 >= 4.18
      - libadwaita >= 1.7
      - gtk3
      - nss
      - alsa-lib
      - mesa-libgbm
      - dbus-libs
      - cups-libs
      - libxkbcommon
      - at-spi2-core
      - at-spi2-atk
