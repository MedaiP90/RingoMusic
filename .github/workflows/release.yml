name: Release

# A "v*" tag builds all package files. A manual run (workflow_dispatch) is a dry run: it builds
# and lints the same files for the given version, without a tag.
# File names use the tag version (for example 0.9.0-rc.1). Only the metadata inside the .deb
# uses "0.9.0~rc.1" (nfpm converts it).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the dry run, for example 0.9.0-rc.1 (must match the files in the repository)"
        required: true
        type: string

permissions:
  contents: read

env:
  NFPM_VERSION: "2.49.0"

jobs:
  version-check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check that all versions agree
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            requested="$INPUT_VERSION"
          else
            requested="$REF_NAME"
          fi
          version="${requested#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$requested' is not a version like 1.2.3 or 1.2.3-rc.1"
            exit 1
          fi

          cargo_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          npm_version="$(node -p 'require("./engine/package.json").version')"
          metainfo_version="$(sed -n 's/.*<release version="\([^"]*\)".*/\1/p' \
            data/io.github.MedaiP90.RingoMusic.metainfo.xml | head -n 1)"

          status=0
          check() {
            if [ "$2" != "$version" ]; then
              echo "::error::$1 has version '$2', but the release version is '$version'"
              status=1
            fi
          }
          check "Cargo.toml (workspace)" "$cargo_version"
          check "engine/package.json" "$npm_version"
          check "newest <release> in the metainfo file" "$metainfo_version"
          [ "$status" -eq 0 ] || exit 1
          echo "version=$version" >> "$GITHUB_OUTPUT"

  stage:
    needs: version-check
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git pkg-config unzip \
            libgtk-4-dev libadwaita-1-dev libdbus-1-dev libglib2.0-bin gettext
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: engine/.nvmrc
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Cache the CastLabs archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ringomusic-build
          key: castlabs-${{ hashFiles('packaging/castlabs.sha256') }}
      - run: packaging/stage.sh
      # The tar keeps the file modes (SUID on chrome-sandbox) and the empty directories.
      - run: tar -cpf stage.tar stage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stage
          path: stage.tar
          retention-days: 7
          if-no-files-found: error

  deb-rpm:
    needs: [version-check, stage]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version-check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stage
      - run: tar -xpf stage.tar
      - name: Install nfpm
        run: |
          base="https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}"
          file="nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          curl --fail --location --silent --show-error --output "$file" "$base/$file"
          curl --fail --location --silent --show-error --output checksums.txt "$base/checksums.txt"
          grep " $file\$" checksums.txt | sha256sum --check -
          sudo tar -xzf "$file" -C /usr/local/bin nfpm
      # SOURCE_DATE_EPOCH makes the tarball stable.
      - name: Build the .deb, the .rpm, and the tarball
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" packaging/build-packages.sh "$VERSION"
      - name: Lint the .deb with lintian
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" debian:13 bash -euc '
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends lintian >/dev/null
            lintian --fail-on error /dist/*.deb'
      - name: Lint the .rpm with rpmlint
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" -v "$PWD/packaging:/packaging:ro" fedora:43 bash -euc '
            dnf install -y -q rpmlint >/dev/null
            rpmlint --config /packaging/rpmlint.toml /dist/*.rpm'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb
          path: dist/ringomusic_*_amd64.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rpm
          path: dist/ringomusic-*-1.x86_64.rpm
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarball
          path: dist/ringomusic-*-x86_64.tar.gz
          if-no-files-found: error

  # The tarball comes from the staged tree (build-packages.sh in deb-rpm). This job checks
  # the PKGBUILD that installs it.
  tarball:
    needs: [version-check, deb-rpm]
    runs-on: ubuntu-latest
    container: archlinux
    env:
      VERSION: ${{ needs.version-check.outputs.version }}
    steps:
      - name: Install system packages
        run: pacman -Syu --noconfirm --needed base-devel namcap git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarball
          path: dist
      # makepkg refuses to run as root.
      - name: Run namcap on the PKGBUILD and the package
        run: |
          useradd --create-home builder
          chown -R builder .
          runuser -u builder -- packaging/aur/test-pkgbuild.sh "$VERSION" 2>&1 | tee namcap.log
          if grep -E ' E: ' namcap.log; then
            echo "::error::namcap reports errors"
            exit 1
          fi

  flatpak:
    needs: version-check
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    env:
      BUNDLE: RingoMusic-${{ needs.version-check.outputs.version }}-x86_64.flatpak
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The image ships the runtimes in a lower overlayfs layer. An update of these
      # runtimes renames directories across layers and fails with EXDEV
      # ("Invalid cross-device link"). Copy the installation to the upper layer first.
      - name: Move the flatpak installation to the writable layer
        run: |
          cp -a /var/lib/flatpak /var/lib/flatpak.copy
          rm -rf /var/lib/flatpak
          mv /var/lib/flatpak.copy /var/lib/flatpak
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          bundle: ${{ env.BUNDLE }}
          manifest-path: packaging/flatpak/io.github.MedaiP90.RingoMusic.yml
          arch: x86_64
          cache: false
          upload-artifact: false
          verbose: true
      - name: Validate the metainfo file
        run: |
          command -v appstreamcli >/dev/null || dnf install -y -q appstream
          appstreamcli validate --no-net data/io.github.MedaiP90.RingoMusic.metainfo.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak
          path: ${{ env.BUNDLE }}
          if-no-files-found: error

  appimage:
    needs: [version-check, stage]
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git pkg-config unzip xz-utils file \
            libgtk-4-dev libadwaita-1-dev libdbus-1-dev libglib2.0-bin gettext appstream \
            desktop-file-utils librsvg2-common
          # Runtime libraries of the Electron engine. linuxdeploy bundles them from this system.
          apt-get install -y --no-install-recommends \
            libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 libgbm1 \
            libasound2t64 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libpango-1.0-0 libcairo2 libgtk-3-0t64 libx11-6 libxext6 libxcb1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stage
      - run: tar -xpf stage.tar
      - name: Build the AppImage
        run: RINGO_REUSE_STAGE=1 packaging/appimage/build-appimage.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage
          path: |
            dist/RingoMusic-*-x86_64.AppImage
            dist/RingoMusic-*-x86_64.AppImage.zsync
          if-no-files-found: error

  # Installs each package in a clean container and runs "ringomusic --version". No playback test.
  smoke-test:
    needs: [version-check, deb-rpm, tarball, flatpak, appimage]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "deb on debian:13", artifact: deb, command: "packaging/test-packages.sh debian:13" }
          - { name: "deb on ubuntu:26.04", artifact: deb, command: "packaging/test-packages.sh ubuntu:26.04" }
          - { name: "rpm on fedora:45", artifact: rpm, command: "packaging/test-packages.sh fedora:45" }
          - { name: "rpm on fedora:44", artifact: rpm, command: "packaging/test-packages.sh fedora:44" }
          - { name: "rpm on opensuse/tumbleweed", artifact: rpm, command: "packaging/test-packages.sh opensuse/tumbleweed" }
          - name: "tarball on archlinux (PKGBUILD)"
            artifact: tarball
            command: 'docker run --rm -v "$PWD:/repo" -w /repo archlinux packaging/aur/test-install.sh "$VERSION"'
          - { name: "AppImage on debian:13", artifact: appimage, command: "packaging/appimage/test-appimage.sh debian:13" }
          - { name: "AppImage on fedora:45", artifact: appimage, command: "packaging/appimage/test-appimage.sh fedora:45" }
          - { name: "AppImage on archlinux", artifact: appimage, command: "packaging/appimage/test-appimage.sh archlinux" }
    name: smoke-test (${{ matrix.name }})
    env:
      VERSION: ${{ needs.version-check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.artifact }}
          path: dist
      # The matrix is fixed in this file, so the command text is trusted.
      - run: ${{ matrix.command }}

  publish:
    needs: [version-check, smoke-test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version-check.outputs.version }}
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{deb,rpm,tarball,flatpak,appimage}"
          merge-multiple: true
          path: release
      - name: Make SHA256SUMS
        working-directory: release
        env:
          LC_ALL: C
        run: |
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS .
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - name: Make the release notes
        run: python3 scripts/release-notes.py "$VERSION" | tee notes.md
      # A tag with "-" (for example v0.9.0-rc.1) is a pre-release.
      - name: Create the GitHub release
        run: |
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" release/* \
            --verify-tag --title "RingoMusic $VERSION" --notes-file notes.md "${flags[@]}"
