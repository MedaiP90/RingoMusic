name: Stage

on:
  pull_request:
    paths:
      - "packaging/**"
      - "engine/**"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git pkg-config unzip shellcheck \
            libgtk-4-dev libadwaita-1-dev libdbus-1-dev libglib2.0-bin gettext
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: engine/.nvmrc
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: shellcheck packaging/*.sh
      - name: Cache the CastLabs archive
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/ringomusic-build
          key: castlabs-${{ hashFiles('packaging/castlabs.sha256') }}
      - run: packaging/stage.sh
