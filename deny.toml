[advisories]
version = 2

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0", # webpki-root-certs, the root certificate data of reqwest
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "GPL-3.0-or-later",
  "MPL-2.0",
]

[bans]
multiple-versions = "warn"
